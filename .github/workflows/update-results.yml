name: Auto-update tournament results

on:
  schedule:
    # Tuesday 14:00 UTC = 16:00 CEST — results published Tuesday midday/afternoon
    - cron: "0 14 * * 2"
    # Friday 14:00 UTC = 16:00 CEST — second publication window
    - cron: "0 14 * * 5"
  workflow_dispatch:
    # Manual trigger available anytime from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Restore cached PDFs
        uses: actions/cache@v4
        with:
          path: results/
          key: pdfs-${{ github.run_id }}
          restore-keys: pdfs-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch new PDFs from website
        run: python scripts/fetch_results.py

      - name: Parse PDFs → tournaments.json
        run: python scripts/parse_pdfs.py

      - name: Safety check — prevent data loss
        id: safety
        run: |
          CURRENT=$(git show HEAD:data/tournaments.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('tournaments',[])))")
          NEW=$(python3 -c "import json; d=json.load(open('data/tournaments.json')); print(len(d.get('tournaments',[])))")
          echo "current_count=$CURRENT" >> $GITHUB_OUTPUT
          echo "new_count=$NEW" >> $GITHUB_OUTPUT
          echo "Current tournaments: $CURRENT | New tournaments: $NEW"
          if [ "$NEW" -lt "$CURRENT" ]; then
            echo "safe=false" >> $GITHUB_OUTPUT
            echo "⚠️  New data has fewer tournaments ($NEW < $CURRENT) — aborting to prevent data loss."
          else
            echo "safe=true" >> $GITHUB_OUTPUT
          fi

      - name: Abort if data looks incomplete
        if: steps.safety.outputs.safe == 'false'
        run: |
          echo "❌ Safety check failed: parsed ${{ steps.safety.outputs.new_count }} tournaments but repo has ${{ steps.safety.outputs.current_count }}."
          echo "Restoring original data..."
          git checkout -- data/tournaments.json
          exit 1

      - name: Check if data changed
        id: diff
        if: steps.safety.outputs.safe == 'true'
        run: |
          git diff --quiet data/tournaments.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.safety.outputs.safe == 'true' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tournaments.json
          git commit -m "Auto-update tournament data — $(date '+%d.%m.%Y')"
          git push

      - name: No new data
        if: steps.safety.outputs.safe == 'true' && steps.diff.outputs.changed == 'false'
        run: echo "No new tournament data found — nothing to deploy."
